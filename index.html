<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Title and Meta Description -->
    <title>Promptro | AI Image Prompts Library</title>
    <meta name="description" content="Discover trending AI image prompts, cinematic prompts, creative templates and inspiration on Promptro." />
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="AI image prompts, trending AI prompts, Midjourney prompts, DALL-E prompts, cinematic prompts, creative AI templates, Promptro" />
    <meta name="author" content="Mohammad Asad Ansari" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Canonical URL (non-www canonical) -->
    <link rel="canonical" href="https://promptro.in" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:title" content="Promptro | AI Image Prompts Library" />
    <meta property="og:description" content="Discover trending AI image prompts, cinematic prompts, creative templates and inspiration on Promptro." />
    <meta property="og:image" content="https://promptro.in/brand/logo.png" />
    <meta property="og:url" content="https://promptro.in" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promptro" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@promptro_in" />
    <meta name="twitter:title" content="Promptro | AI Image Prompts Library" />
    <meta name="twitter:description" content="Discover trending AI image prompts, cinematic prompts, creative templates and inspiration on Promptro." />
    <meta name="twitter:image" content="https://promptro.in/brand/logo.png" />

    <!-- Favicon Links -->
    <link rel="shortcut icon" href="/brand/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon.png" />
    <link rel="mask-icon" href="/brand/favicon.png" color="#8b5cf6" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#f8f7fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b14" media="(prefers-color-scheme: dark)" />

    <!-- WebSite Schema (Sitelinks Searchbox) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Promptro",
        "url": "https://promptro.in",
        "description": "Discover trending AI image prompts, cinematic prompts, creative templates and inspiration on Promptro.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://promptro.in/explore?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Organization Schema (EEAT Trust Signal) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Promptro",
        "url": "https://promptro.in",
        "logo": "https://promptro.in/brand/logo.png",
        "foundingDate": "2024",
        "description": "Promptro is a curated AI image prompt library helping creators, designers and artists generate stunning visuals using the best AI models.",
        "founder": {
          "@type": "Person",
          "name": "Mohammad Asad Ansari",
          "jobTitle": "Founder",
          "url": "https://promptro.in/about"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hello@promptro.in",
          "contactType": "customer support"
        },
        "sameAs": [
          "https://instagram.com/promptro.in",
          "https://twitter.com/promptro_in"
        ]
      }
    </script>

    <!-- Preloading Theme Script -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('promptro:theme');
          if (savedTheme === 'Dark' || savedTheme === 'Light') {
            document.documentElement.dataset.theme = savedTheme.toLowerCase();
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
