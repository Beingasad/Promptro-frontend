<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Title and Meta Description for Search Engine Optimization -->
    <title>Promptro - AI Image Prompts & Creative Templates</title>
    <meta name="description" content="Discover trending AI prompts, cinematic styles, portrait prompts and creative templates." />
    
    <!-- SEO Meta Tags -->
    <meta name="keywords" content="AI prompts, ChatGPT prompts, image prompts, cinematic prompts, portrait prompts, Promptro" />
    <meta name="author" content="Promptro Team" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Canonical URL (Fixes duplicate www/non-www issues) -->
    <link rel="canonical" href="https://promptro.in" />

    <!-- Open Graph (Facebook / LinkedIn) Social Sharing Meta Tags -->
    <meta property="og:title" content="Promptro - AI Image Prompts & Creative Templates" />
    <meta property="og:description" content="Discover trending AI prompts, cinematic styles, portrait prompts and creative templates." />
    <meta property="og:image" content="https://promptro.in/brand/logo.png" />
    <meta property="og:url" content="https://promptro.in" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Promptro" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Promptro - AI Image Prompts & Creative Templates" />
    <meta name="twitter:description" content="Discover trending AI prompts, cinematic styles, portrait prompts and creative templates." />
    <meta name="twitter:image" content="https://promptro.in/brand/logo.png" />

    <!-- Favicon Links -->
    <link rel="shortcut icon" href="/brand/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon.png" />
    <link rel="mask-icon" href="/brand/favicon.png" color="#8b5cf6" />
    
    <!-- Theme Toggles for Browser Bar Coloring -->
    <meta name="theme-color" content="#f8f7fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0b14" media="(prefers-color-scheme: dark)" />

    <!-- Website Structured Data / Rich Snippet (JSON-LD Schema) for Google Branding -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Promptro",
        "url": "https://promptro.in",
        "description": "Discover trending AI prompts, cinematic styles, portrait prompts and creative templates.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://promptro.in/explore?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Preloading Theme Script to Prevent Layout Shifts and Flashing -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('promptro:theme');
          if (savedTheme === 'Dark' || savedTheme === 'Light') {
            document.documentElement.dataset.theme = savedTheme.toLowerCase();
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
